name: ci
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package + dev deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: black --check
        run: black --check src/pydmcsid tests scripts
      - name: pylint
        run: pylint src/pydmcsid tests scripts
      - name: Cache test fixtures
        # Tunes are HVSC copyright works and the native editor disks are csdb
        # copyright works (never committed); the gitignored tunecache is cached
        # across runs, keyed on the manifest/tune lists, so downloads happen once.
        uses: actions/cache@v6
        with:
          path: tests/.tunecache
          key: hvsc-tunecache-${{ hashFiles('tests/fixtures/dmc_corpus.txt', 'tests/fixtures/dmc_native_manifest.txt', 'tests/helpers.py', 'tests/test_oracle_hvsc.py', 'tests/test_native.py', 'scripts/fetch_tunes.py') }}
          restore-keys: |
            hvsc-tunecache-
      - name: Fetch native editor disks
        # Resume-safe: reuses the cached dl/ tree and release pages, only
        # downloads what the manifest pins and the cache lacks.
        run: pysidtracker fixtures fetch tests/fixtures/dmc_native_manifest.txt --cache tests/.tunecache/native
      - name: pytest + coverage (> 85%, oracle excluded)
        # The non-oracle suite fetches tunes from the HVSC mirror into the cached
        # tunecache; the byte-exact-vs-oracle job below is the Docker gate.
        run: pytest --cov=pydmcsid --cov-report=term-missing --cov-fail-under=85

  oracle:
    # Byte-exact comparison of DmcPlayer.render_grid against the sidtrace
    # sidplayfp oracle over real HVSC DMC tunes -- one per modelled generation.
    # Never skipped: a failed HVSC download or oracle render fails the job. HVSC
    # tunes and oracle CSVs are cached.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install package + dev deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Pull sidtrace oracle image
        id: image
        run: |
          docker pull anarkiwi/sidtrace:latest
          digest=$(docker inspect --format '{{index .RepoDigests 0}}' anarkiwi/sidtrace:latest)
          echo "digest=${digest##*@}" >> "$GITHUB_OUTPUT"
      - name: Cache HVSC tunes
        uses: actions/cache@v6
        with:
          path: tests/.tunecache
          key: hvsc-${{ hashFiles('tests/test_oracle_hvsc.py') }}
          restore-keys: hvsc-
      - name: Cache oracle CSVs
        uses: actions/cache@v6
        with:
          path: .oracle-cache/csv
          key: oracle-csv-${{ steps.image.outputs.digest }}-${{ hashFiles('tests/test_oracle_hvsc.py') }}
      - name: Oracle comparison (never skipped)
        run: pytest -m oracle -n auto

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Build sdist + wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build
      - name: Smoke test the wheel
        run: |
          pip install dist/*.whl
          python -c "import pydmcsid; print(pydmcsid.__version__)"
          python -c "import pydmcsid"

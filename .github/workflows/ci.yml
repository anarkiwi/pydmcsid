name: ci
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package + dev deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: black --check
        run: black --check src/pydmcsid tests
      - name: pylint
        run: pylint src/pydmcsid tests
      - name: Cache HVSC test tunes
        # DMC tunes are HVSC copyright works (NEVER committed); they are fetched
        # on demand into the gitignored tunecache.  Cache that dir across runs,
        # keyed on the corpus lists + fetch script, so tunes download once.
        uses: actions/cache@v4
        with:
          path: tests/.tunecache
          key: hvsc-tunecache-${{ hashFiles('tests/fixtures/dmc_corpus.txt', 'tests/fixtures/dmc_clusters.txt', 'scripts/fetch_tunes.py') }}
          restore-keys: |
            hvsc-tunecache-
      - name: pytest + coverage (> 85%)
        # Tunes are HVSC copyright works (never committed); CI has no
        # SIDTRACE_BIN, so the byte-exact player tests validate against the
        # committed frozen oracle grids, and tune-dependent tests fetch from
        # the HVSC mirror into the cached tunecache (skipping only a tune that
        # is genuinely unreachable).
        run: pytest -n auto --cov=pydmcsid --cov-report=term-missing --cov-fail-under=85

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Build sdist + wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build
      - name: Smoke test the wheel
        run: |
          pip install dist/*.whl
          python -c "import pydmcsid; print(pydmcsid.__version__)"
          python -c "import pydmcsid"

name: ci
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package + dev deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: black --check
        run: black --check src/pydmcsid tests scripts
      - name: pylint
        run: pylint src/pydmcsid tests scripts
      - uses: anarkiwi/pysidtracker/.github/actions/cache@v0.37.0
        with:
          key: ${{ hashFiles('tests/fixtures/*.txt', 'tests/*.py') }}
          tunes: tests tests/fixtures/dmc_corpus.txt
          native: tests/fixtures/dmc_native_manifest.txt
      - name: pytest + coverage (> 85%, oracle excluded)
        run: pytest --cov=pydmcsid --cov-report=term-missing --cov-fail-under=85

  oracle:
    # Byte-exact comparison of DmcPlayer.render_grid against the sidtrace
    # sidplayfp oracle over real HVSC DMC tunes -- one per modelled generation.
    # Never skipped: a failed HVSC download or oracle render fails the job.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install package + dev deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - uses: anarkiwi/pysidtracker/.github/actions/cache@v0.37.0
        with:
          key: ${{ hashFiles('tests/test_oracle_hvsc.py') }}
          sidtrace: "true"
          tunes: tests/test_oracle_hvsc.py
      - name: Oracle comparison (never skipped)
        run: pytest -m oracle -n auto

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Build sdist + wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build
      - name: Smoke test the wheel
        run: |
          pip install dist/*.whl
          python -c "import pydmcsid; print(pydmcsid.__version__)"
          python -c "import pydmcsid"
